
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média Escolar</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1>Calculadora de Média Escolar</h1>
        <p>Digite as duas notas do aluno:</p>

        <form id="form-notas">
            <label for="nota1">Primeira nota:</label>
            <input type="number" id="nota1" min="0" max="10"
                   step="0.1" required>

            <label for="nota2">Segunda nota:</label>
            <input type="number" id="nota2" min="0" max="10"
                   step="0.1" required>

            <button type="submit">Calcular média</button>
        </form>

        <p id="resultado">O resultado aparecerá aqui.</p>
    </main>
</body>
</html>
